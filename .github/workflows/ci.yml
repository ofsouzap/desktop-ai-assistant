name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: uv sync --locked --extra dev
      - run: uv run pytest
      - run: uv run mypy .
      - run: uv run ruff check

  version-tag:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify tag matches project version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          project_version="$(python - <<'PY'
          import tomllib

          with open("pyproject.toml", "rb") as file:
              print(tomllib.load(file)["project"]["version"])
          PY
          )"

          expected_tag="v${project_version}"

          if [[ "$TAG_NAME" != "$expected_tag" ]]; then
            echo "::error::Tag $TAG_NAME does not match pyproject.toml version $project_version"
            exit 1
          fi

          echo "Tag $TAG_NAME matches project version $project_version"
